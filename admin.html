<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin – Immy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root{--bg:#f4f6fb;--text:#1e293b;--muted:#64748b;--card:#fff;--border:#e2e8f0;--primary:#4f46e5;--err:#dc2626;--ok:#059669}
    @media (prefers-color-scheme: dark){:root{--bg:#0f172a;--text:#f8fafc;--muted:#94a3b8;--card:#1e293b;--border:#334155;--primary:#6366f1;--err:#f87171;--ok:#34d399}}
    *{box-sizing:border-box;margin:0;padding:0}
    html.auth-pending body{visibility:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
    .wrap{max-width:960px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    h1{font-size:1.5rem}
    .btn{background:var(--primary);color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.85rem;display:inline-block}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn.danger{background:var(--err)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    .stat b{font-size:1.8rem;display:block}
    .stat span{color:var(--muted);font-size:.85rem}
    .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
    th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
    th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
    tr:last-child td{border-bottom:none}
    .tag{padding:3px 9px;border-radius:8px;font-size:.75rem;font-weight:700}
    .tag.admin{background:rgba(99,102,241,.18);color:var(--primary)}
    .tag.student{background:rgba(100,116,139,.18);color:var(--muted)}
    .tag.blocked{background:rgba(220,38,38,.15);color:var(--err)}
    .actions{display:flex;gap:6px}
    #status{color:var(--muted);padding:20px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Admin Panel</h1>
      <div>
        <a class="btn ghost" href="app.html">Back to app</a>
        <button class="btn ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total users</span></div>
      <div class="stat"><b id="sAdmins">0</b><span>Admins</span></div>
      <div class="stat"><b id="sBlocked">0</b><span>Blocked</span></div>
      <div class="stat"><b id="sTasks">0</b><span>Total tasks</span></div>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Tasks</th><th>Notes</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="status">Loading...</p>
    </div>
  </div>

  <script>document.documentElement.classList.add('auth-pending');</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const count = (json) => { try { return JSON.parse(json || '[]').length; } catch { return 0; } };

    function cell(text) { const td = document.createElement('td'); td.textContent = text; return td; }
    function tag(text, cls) { const s = document.createElement('span'); s.className = 'tag ' + cls; s.textContent = text; return s; }

    async function load() {
      const [p, d] = await Promise.all([
        Immy.sb.from('profiles').select('*').order('created_at', { ascending: false }),
        Immy.sb.from('user_data').select('user_id,data')
      ]);
      if (p.error) { $('status').textContent = 'Error: ' + p.error.message; return; }
      const dataByUser = {};
      (d.data || []).forEach((r) => { dataByUser[r.user_id] = r.data || {}; });

      const rows = $('rows');
      rows.replaceChildren();
      let admins = 0, blocked = 0, totalTasks = 0;

      p.data.forEach((u) => {
        const ud = dataByUser[u.id] || {};
        const tasks = count(ud.myTasks), notes = count(ud.myNotes);
        totalTasks += tasks;
        if (u.role === 'admin') admins++;
        if (u.blocked) blocked++;

        const tr = document.createElement('tr');
        tr.appendChild(cell(u.full_name || '(no name)'));
        tr.appendChild(cell(u.email || ''));

        const roleTd = document.createElement('td');
        roleTd.appendChild(tag(u.role, u.role));
        if (u.blocked) { roleTd.append(' '); roleTd.appendChild(tag('blocked', 'blocked')); }
        tr.appendChild(roleTd);

        tr.appendChild(cell(tasks));
        tr.appendChild(cell(notes));
        tr.appendChild(cell(new Date(u.created_at).toLocaleDateString()));

        const act = document.createElement('td');
        const box = document.createElement('div'); box.className = 'actions';
        if (u.id !== Immy.user.id) {
          const b1 = document.createElement('button');
          b1.className = 'btn ' + (u.blocked ? '' : 'danger'); b1.type = 'button';
          b1.textContent = u.blocked ? 'Unblock' : 'Block';
          b1.onclick = () => update(u, { blocked: !u.blocked }, (u.blocked ? 'Unblock ' : 'Block ') + (u.email || 'user') + '?');
          const b2 = document.createElement('button');
          b2.className = 'btn ghost'; b2.type = 'button';
          b2.textContent = u.role === 'admin' ? 'Make student' : 'Make admin';
          b2.onclick = () => update(u, { role: u.role === 'admin' ? 'student' : 'admin' }, 'Change role of ' + (u.email || 'user') + '?');
          box.append(b1, b2);
        } else {
          box.textContent = '(you)';
        }
        act.appendChild(box);
        tr.appendChild(act);
        rows.appendChild(tr);
      });

      $('sTotal').textContent = p.data.length;
      $('sAdmins').textContent = admins;
      $('sBlocked').textContent = blocked;
      $('sTasks').textContent = totalTasks;
      $('status').textContent = p.data.length ? '' : 'No users yet.';
    }

    async function update(u, changes, question) {
      if (!confirm(question)) return;
      const { error } = await Immy.sb.from('profiles').update(changes).eq('id', u.id);
      if (error) alert('Error: ' + error.message);
      load();
    }

    (async () => {
      try {
        const ok = await Immy.requireLogin({ admin: true });
        if (!ok) return;
        document.documentElement.classList.remove('auth-pending');
        $('logoutBtn').onclick = () => Immy.logout();
        load();
      } catch (e) {
        console.error(e);
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
